# A push to development runs the analyzer, the tests, and uploads a debug APK.
# This workflow does not deploy to the Play Store.

name: Development

on:
  push:
    branches:
      - development

jobs:
  check:
    name: Analyze, test, and build a debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build a debug APK
        run: flutter build apk --debug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
